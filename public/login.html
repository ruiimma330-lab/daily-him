<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FEE500" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="백현" />
  <title>백현</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    html, body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
      background: #fff;
      color: #191919;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "PingFang SC", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(360px, 100%);
      text-align: center;
    }

    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fff4e8;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(90, 60, 40, 0.08);
    }

    .mark svg { width: 100%; height: 100%; display: block; }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    p.lead {
      margin: 0 0 28px;
      font-size: 14px;
      color: #8d8d8d;
    }

    form { display: flex; flex-direction: column; gap: 12px; }

    input {
      width: 100%;
      height: 48px;
      box-sizing: border-box;
      border: 0;
      border-radius: 12px;
      background: #f7f7f8;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
      padding: 0 14px;
      font-size: 16px;
      color: #191919;
      outline: none;
    }

    input:focus { box-shadow: inset 0 0 0 2px #191919; }

    button {
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #FEE500;
      color: #191919;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }
    button:active { background: #f0d800; }

    .error {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      color: #e54d2e;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <ellipse cx="18" cy="20" rx="9" ry="13" fill="#E8A878"/>
        <ellipse cx="46" cy="20" rx="9" ry="13" fill="#E8A878"/>
        <ellipse cx="18" cy="20" rx="5" ry="8" fill="#F6D8C0"/>
        <ellipse cx="46" cy="20" rx="5" ry="8" fill="#F6D8C0"/>
        <circle cx="32" cy="36" r="18" fill="#F4C9A4"/>
        <ellipse cx="25" cy="34.5" rx="2.3" ry="3" fill="#3C2C24"/>
        <ellipse cx="39" cy="34.5" rx="2.3" ry="3" fill="#3C2C24"/>
        <ellipse cx="32" cy="41" rx="3.6" ry="2.5" fill="#E07B6C"/>
        <path d="M32 42.2v2.2" fill="none" stroke="#C85A52" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M26.8 46.2c1.6 1.8 3.3 2.6 5.2 2.6s3.6-.8 5.2-2.6" fill="none" stroke="#3C2C24" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="21.5" cy="40" r="2.3" fill="#F3A8A8" opacity=".9"/>
        <circle cx="42.5" cy="40" r="2.3" fill="#F3A8A8" opacity=".9"/>
      </svg>
    </div>
    <h1>백현</h1>
    <p class="lead">비밀번호를 입력해 주세요</p>
    <form id="login-form">
      <input id="password" type="password" name="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required />
      <button type="submit" id="submit">로그인</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const input = document.getElementById('password');
      const button = document.getElementById('submit');
      const error = document.getElementById('error');

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          });
          if (response.status === 429) {
            error.textContent = '시도가 너무 많아요. 잠시 후 다시 해 주세요.';
            return;
          }
          if (!response.ok) {
            error.textContent = '비밀번호가 맞지 않아요.';
            return;
          }
          location.href = '/';
        } catch (err) {
          error.textContent = '연결을 확인해 주세요.';
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
