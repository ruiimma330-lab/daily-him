<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Him" />
  <title>Daily Him</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/brand/brand.css" />
  <link rel="stylesheet" href="/pwa.css" />
  <link rel="stylesheet" href="/mobile-lock.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
      background: #fff;
      color: #191919;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "PingFang SC", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(360px, 100%);
      text-align: center;
    }

    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #f4f4f4;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    .mark img, .mark svg { width: 100%; height: 100%; object-fit: cover; display: block; }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    p.lead {
      margin: 0 0 28px;
      font-size: 14px;
      color: #8d8d8d;
    }

    form { display: flex; flex-direction: column; gap: 12px; }

    input {
      width: 100%;
      height: 48px;
      box-sizing: border-box;
      border: 0;
      border-radius: 12px;
      background: #f7f7f8;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
      padding: 0 14px;
      font-size: 16px;
      color: #191919;
      outline: none;
    }

    input:focus { box-shadow: inset 0 0 0 2px #191919; }

    button {
      height: 48px;
      border: 1px solid #1c1c1c;
      border-radius: 0;
      background: #1c1c1c;
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.12em;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }
    button:active { background: #333; }

    button.secondary {
      background: #f7f7f8;
      font-weight: 600;
    }

    .error {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      color: #e54d2e;
    }

    .hint {
      margin: 8px 0 0;
      font-size: 12px;
      color: #8d8d8d;
      line-height: 1.4;
    }

    .age-check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      text-align: left;
      font-size: 13px;
      line-height: 1.45;
      color: #3c3c3c;
    }

    .age-check input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
    .age-check a { color: #1c1c1c; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tabs button {
      height: 40px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #8d8d8d;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    .tabs button.active {
      background: transparent;
      color: #1c1c1c;
      border-bottom-color: #1c1c1c;
    }

    a.back-cover {
      display: inline-block;
      margin-bottom: 18px;
      color: #8d8883;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-decoration: none;
    }

    [hidden] { display: none !important; }

    .ai-notice {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: end center;
      padding: 22px;
      background: rgba(28, 28, 28, 0.28);
    }
    .ai-notice-card { width: min(340px, 100%); margin-bottom: calc(24px + env(safe-area-inset-bottom)); background: #fff; padding: 22px 20px 16px; text-align: left; }
    .ai-notice-card h2 { margin: 0 0 8px; font-size: 16px; font-weight: 400; letter-spacing: 0.08em; }
    .ai-notice-card p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #6f6a64; font-weight: 300; }
    .ai-notice-card button { width: 100%; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="88" height="88" />
    </div>
    <a class="back-cover" href="/shell/cover.html">返回</a>
    <h1 class="dh-wordmark" data-brand></h1>
    <p class="lead" id="lead">登录或注册后选择爱豆</p>

    <form id="site-form" hidden>
      <input id="site-password" type="password" name="site-password" autocomplete="current-password" placeholder="站点密码" aria-label="站点密码" required />
      <button type="submit" id="site-submit">解锁</button>
      <p class="error" id="site-error" role="alert"></p>
      <p class="hint">站点锁已开启。解锁后即可注册或登录。</p>
    </form>

    <div id="account-panel" hidden>
      <div class="tabs" role="tablist">
        <button type="button" class="active" id="tab-login" role="tab" aria-selected="true">登录</button>
        <button type="button" id="tab-register" role="tab" aria-selected="false">注册</button>
      </div>
      <form id="account-form">
        <input id="username" type="text" name="username" autocomplete="username" placeholder="用户名" aria-label="用户名" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" />
        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="密码（至少 8 位）" aria-label="密码" required minlength="8" maxlength="128" />
        <label class="age-check" id="age-row" hidden>
          <input id="age14" type="checkbox" />
          <span>我已年满 14 岁</span>
        </label>
        <p class="hint" id="age-links" hidden>注册即表示已阅读 <a href="/legal/terms.html">用户协议</a> 和 <a href="/legal/privacy.html">隐私政策</a></p>
        <button type="submit" id="account-submit">登录</button>
        <p class="error" id="account-error" role="alert"></p>
        <p class="hint" id="account-hint">用户名为 3–32 位字母、数字或下划线。密码至少 8 位。</p>
      </form>
    </div>
    <p class="login-disclaimer" style="margin:24px 0 8px;text-align:center;font-size:11px;color:#9a9a9a;">角色均为 AI 模拟，非本人 · 仅供个人使用</p>
  </main>
  <div class="ai-notice" id="ai-notice" hidden>
    <div class="ai-notice-card" role="dialog" aria-modal="true" aria-labelledby="ai-notice-title">
      <h2 id="ai-notice-title">开始之前</h2>
      <p>这里的角色由 AI 模拟，不是本人。聊天内容会用于生成回复，不代表艺人本人的意思。</p>
      <button type="button" id="ai-notice-ok">知道了</button>
    </div>
  </div>
  <script src="/sw-heal.js"></script>
  <script src="/account-cache.js"></script>
  <script>
    (function () {
      const siteForm = document.getElementById('site-form');
      const accountPanel = document.getElementById('account-panel');
      const accountForm = document.getElementById('account-form');
      const lead = document.getElementById('lead');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const accountSubmit = document.getElementById('account-submit');
      const accountError = document.getElementById('account-error');
      const sitePassword = document.getElementById('site-password');
      const siteSubmit = document.getElementById('site-submit');
      const siteError = document.getElementById('site-error');
      const aiNotice = document.getElementById('ai-notice');
      const aiNoticeOk = document.getElementById('ai-notice-ok');

      let mode = 'login';
      let registeredAccountId = '';

      function destination() {
        const next = new URLSearchParams(location.search).get('next') || '';
        if (next === 'pick') return '/shell/pick.html';
        if (next === 'chat') return '/';
        return '/shell/cover.html';
      }

      function setMode(next) {
        mode = next;
        const register = next === 'register';
        tabLogin.classList.toggle('active', !register);
        tabRegister.classList.toggle('active', register);
        tabLogin.setAttribute('aria-selected', register ? 'false' : 'true');
        tabRegister.setAttribute('aria-selected', register ? 'true' : 'false');
        accountSubmit.textContent = register ? '注册' : '登录';
        password.autocomplete = register ? 'new-password' : 'current-password';
        lead.textContent = register ? '注册一个账号' : '登录后选择爱豆';
        document.getElementById('age-row').hidden = !register;
        document.getElementById('age-links').hidden = !register;
        accountError.textContent = '';
      }

      function showAccount() {
        siteForm.hidden = true;
        accountPanel.hidden = false;
        username.focus();
      }

      function showSiteGate() {
        siteForm.hidden = false;
        accountPanel.hidden = true;
        lead.textContent = '请输入站点密码';
        sitePassword.focus();
      }

      tabLogin.addEventListener('click', () => setMode('login'));
      tabRegister.addEventListener('click', () => setMode('register'));

      aiNoticeOk.addEventListener('click', async () => {
        aiNoticeOk.disabled = true;
        try {
          const response = await fetch('/api/me/ai-disclaimer', { method: 'POST' });
          if (!response.ok) throw new Error('acknowledgement failed');
          if (registeredAccountId) localStorage.setItem(`idol-ai-disclaimer-${registeredAccountId}`, '1');
          location.href = destination();
        } catch (_) {
          accountError.textContent = '请检查网络连接后重试。';
          aiNoticeOk.disabled = false;
        }
      });

      siteForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        siteError.textContent = '';
        siteSubmit.disabled = true;
        try {
          const response = await fetch('/api/site-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: sitePassword.value }),
          });
          if (response.status === 429) {
            siteError.textContent = '尝试太多次了，请稍后再试。';
            return;
          }
          if (!response.ok) {
            siteError.textContent = '密码不正确。';
            return;
          }
          showAccount();
        } catch (err) {
          siteError.textContent = '请检查网络连接。';
        } finally {
          siteSubmit.disabled = false;
        }
      });

      accountForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        accountError.textContent = '';
        if (mode === 'register' && !document.getElementById('age14').checked) {
          accountError.textContent = '请先确认已年满 14 岁';
          return;
        }
        accountSubmit.disabled = true;
        const endpoint = mode === 'register' ? '/api/register' : '/api/login';
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: username.value.trim(),
              password: password.value,
              ...(mode === 'register' ? { age14: true } : {}),
            }),
          });
          if (response.status === 429) {
            accountError.textContent = '尝试太多次了，请稍后再试。';
            return;
          }
          if (response.status === 409) {
            accountError.textContent = '这个用户名已经被使用。';
            return;
          }
          if (response.status === 400) {
            accountError.textContent = '请检查用户名或密码格式。';
            return;
          }
          if (response.status === 401) {
            const data = await response.json().catch(() => ({}));
            if (data && data.need === 'site') {
              showSiteGate();
              siteError.textContent = '请先解锁站点。';
              return;
            }
            accountError.textContent = mode === 'register'
              ? '注册失败。'
              : '用户名或密码不正确。';
            return;
          }
          if (!response.ok) {
            accountError.textContent = '请稍后再试。';
            return;
          }
          const data = await response.json().catch(() => ({}));
          if (window.AccountCache && data.user && data.user.id) {
            window.AccountCache.adopt(localStorage, data.user.id);
          }
          if (mode === 'register' && data.aiDisclaimerAcknowledged === false) {
            registeredAccountId = data.user && data.user.id ? data.user.id : '';
            aiNotice.hidden = false;
            return;
          }
          location.href = destination();
        } catch (err) {
          accountError.textContent = '请检查网络连接。';
        } finally {
          accountSubmit.disabled = false;
        }
      });

      fetch('/api/auth-config')
        .then((r) => r.json())
        .then((cfg) => {
          if (cfg && cfg.loggedIn) {
            location.href = destination();
            return;
          }
          if (cfg && cfg.siteGate && !cfg.siteUnlocked) {
            showSiteGate();
          } else {
            showAccount();
          }
        })
        .catch(() => {
          showAccount();
        });
    })();
  </script>
  <script src="/brand/brand.js"></script>
  <script src="/mobile-lock.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
