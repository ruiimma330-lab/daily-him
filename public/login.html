<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FEE500" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="백현" />
  <title>백현</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    html, body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
      background: #fff;
      color: #191919;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "PingFang SC", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(360px, 100%);
      text-align: center;
    }

    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fff4e8;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(90, 60, 40, 0.08);
    }

    .mark svg { width: 100%; height: 100%; display: block; }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    p.lead {
      margin: 0 0 28px;
      font-size: 14px;
      color: #8d8d8d;
    }

    form { display: flex; flex-direction: column; gap: 12px; }

    input {
      width: 100%;
      height: 48px;
      box-sizing: border-box;
      border: 0;
      border-radius: 12px;
      background: #f7f7f8;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
      padding: 0 14px;
      font-size: 16px;
      color: #191919;
      outline: none;
    }

    input:focus { box-shadow: inset 0 0 0 2px #191919; }

    button {
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #FEE500;
      color: #191919;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }
    button:active { background: #f0d800; }

    button.secondary {
      background: #f7f7f8;
      font-weight: 600;
    }

    .error {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      color: #e54d2e;
    }

    .hint {
      margin: 8px 0 0;
      font-size: 12px;
      color: #8d8d8d;
      line-height: 1.4;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tabs button {
      height: 40px;
      background: #f7f7f8;
      font-size: 14px;
      font-weight: 600;
    }

    .tabs button.active {
      background: #FEE500;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <ellipse cx="18" cy="20" rx="9" ry="13" fill="#E8A878"/>
        <ellipse cx="46" cy="20" rx="9" ry="13" fill="#E8A878"/>
        <ellipse cx="18" cy="20" rx="5" ry="8" fill="#F6D8C0"/>
        <ellipse cx="46" cy="20" rx="5" ry="8" fill="#F6D8C0"/>
        <circle cx="32" cy="36" r="18" fill="#F4C9A4"/>
        <ellipse cx="25" cy="34.5" rx="2.3" ry="3" fill="#3C2C24"/>
        <ellipse cx="39" cy="34.5" rx="2.3" ry="3" fill="#3C2C24"/>
        <ellipse cx="32" cy="41" rx="3.6" ry="2.5" fill="#E07B6C"/>
        <path d="M32 42.2v2.2" fill="none" stroke="#C85A52" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M26.8 46.2c1.6 1.8 3.3 2.6 5.2 2.6s3.6-.8 5.2-2.6" fill="none" stroke="#3C2C24" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="21.5" cy="40" r="2.3" fill="#F3A8A8" opacity=".9"/>
        <circle cx="42.5" cy="40" r="2.3" fill="#F3A8A8" opacity=".9"/>
      </svg>
    </div>
    <h1>백현</h1>
    <p class="lead" id="lead">계정으로 들어가 주세요</p>

    <form id="site-form" hidden>
      <input id="site-password" type="password" name="site-password" autocomplete="current-password" placeholder="사이트 비밀번호" aria-label="사이트 비밀번호" required />
      <button type="submit" id="site-submit">잠금 해제</button>
      <p class="error" id="site-error" role="alert"></p>
      <p class="hint">사이트 잠금이 켜져 있어요. 해제한 뒤 계정을 만들거나 로그인할 수 있어요.</p>
    </form>

    <div id="account-panel" hidden>
      <div class="tabs" role="tablist">
        <button type="button" class="active" id="tab-login" role="tab" aria-selected="true">로그인</button>
        <button type="button" id="tab-register" role="tab" aria-selected="false">회원가입</button>
      </div>
      <form id="account-form">
        <input id="username" type="text" name="username" autocomplete="username" placeholder="사용자 이름" aria-label="사용자 이름" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" />
        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="비밀번호 (8자 이상)" aria-label="비밀번호" required minlength="8" maxlength="128" />
        <button type="submit" id="account-submit">로그인</button>
        <p class="error" id="account-error" role="alert"></p>
        <p class="hint" id="account-hint">사용자 이름은 영문·숫자·밑줄 3~32자. 비밀번호는 8자 이상.</p>
      </form>
    </div>
    <p class="login-disclaimer" style="margin:24px 0 8px;text-align:center;font-size:11px;color:#9a9a9a;">角色均为 AI 模拟，非本人 · 仅供个人使用</p>
  </main>
  <script>
    (function () {
      const siteForm = document.getElementById('site-form');
      const accountPanel = document.getElementById('account-panel');
      const accountForm = document.getElementById('account-form');
      const lead = document.getElementById('lead');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const accountSubmit = document.getElementById('account-submit');
      const accountError = document.getElementById('account-error');
      const sitePassword = document.getElementById('site-password');
      const siteSubmit = document.getElementById('site-submit');
      const siteError = document.getElementById('site-error');

      let mode = 'login';

      function setMode(next) {
        mode = next;
        const register = next === 'register';
        tabLogin.classList.toggle('active', !register);
        tabRegister.classList.toggle('active', register);
        tabLogin.setAttribute('aria-selected', register ? 'false' : 'true');
        tabRegister.setAttribute('aria-selected', register ? 'true' : 'false');
        accountSubmit.textContent = register ? '회원가입' : '로그인';
        password.autocomplete = register ? 'new-password' : 'current-password';
        lead.textContent = register ? '새 계정을 만들어 주세요' : '계정으로 들어가 주세요';
        accountError.textContent = '';
      }

      function showAccount() {
        siteForm.hidden = true;
        accountPanel.hidden = false;
        username.focus();
      }

      function showSiteGate() {
        siteForm.hidden = false;
        accountPanel.hidden = true;
        lead.textContent = '사이트 비밀번호를 입력해 주세요';
        sitePassword.focus();
      }

      tabLogin.addEventListener('click', () => setMode('login'));
      tabRegister.addEventListener('click', () => setMode('register'));

      siteForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        siteError.textContent = '';
        siteSubmit.disabled = true;
        try {
          const response = await fetch('/api/site-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: sitePassword.value }),
          });
          if (response.status === 429) {
            siteError.textContent = '시도가 너무 많아요. 잠시 후 다시 해 주세요.';
            return;
          }
          if (!response.ok) {
            siteError.textContent = '비밀번호가 맞지 않아요.';
            return;
          }
          showAccount();
        } catch (err) {
          siteError.textContent = '연결을 확인해 주세요.';
        } finally {
          siteSubmit.disabled = false;
        }
      });

      accountForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        accountError.textContent = '';
        accountSubmit.disabled = true;
        const endpoint = mode === 'register' ? '/api/register' : '/api/login';
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: username.value.trim(),
              password: password.value,
            }),
          });
          if (response.status === 429) {
            accountError.textContent = '시도가 너무 많아요. 잠시 후 다시 해 주세요.';
            return;
          }
          if (response.status === 409) {
            accountError.textContent = '이미 쓰이는 사용자 이름이에요.';
            return;
          }
          if (response.status === 400) {
            accountError.textContent = '사용자 이름 또는 비밀번호 형식을 확인해 주세요.';
            return;
          }
          if (response.status === 401) {
            const data = await response.json().catch(() => ({}));
            if (data && data.need === 'site') {
              showSiteGate();
              siteError.textContent = '사이트 잠금을 먼저 해제해 주세요.';
              return;
            }
            accountError.textContent = mode === 'register'
              ? '가입에 실패했어요.'
              : '사용자 이름 또는 비밀번호가 맞지 않아요.';
            return;
          }
          if (!response.ok) {
            accountError.textContent = '잠시 후 다시 해 주세요.';
            return;
          }
          location.href = '/';
        } catch (err) {
          accountError.textContent = '연결을 확인해 주세요.';
        } finally {
          accountSubmit.disabled = false;
        }
      });

      fetch('/api/auth-config')
        .then((r) => r.json())
        .then((cfg) => {
          if (cfg && cfg.loggedIn) {
            location.href = '/';
            return;
          }
          if (cfg && cfg.siteGate && !cfg.siteUnlocked) {
            showSiteGate();
          } else {
            showAccount();
          }
        })
        .catch(() => {
          showAccount();
        });
    })();
  </script>
</body>
</html>
