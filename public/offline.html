<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Daily Him</title>
  <link rel="stylesheet" href="/brand/brand.css" />
  <link rel="stylesheet" href="/mobile-lock.css" />
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #111; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK SC", "Noto Sans CJK KR", sans-serif;
      font-weight: 300;
    }
    p { margin: 22px 0 0; font-size: 15px; letter-spacing: 0.04em; color: #6f6a64; line-height: 1.6; }
    button {
      margin-top: 28px;
      height: 44px;
      padding: 0 22px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      font: inherit;
      letter-spacing: 0.14em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 class="dh-wordmark" data-brand></h1>
  <p>网络断开了，连上后自动恢复</p>
  <button type="button" onclick="location.reload()">重试</button>
  <script src="/brand/brand.js"></script>
  <script src="/mobile-lock.js"></script>
</body>
</html>
