<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Daily Him</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell/picker.css" />
  <link rel="stylesheet" href="/mobile-lock.css" />
  <link rel="stylesheet" href="/brand/brand.css" />
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
</head>
<body>
  <div class="picker" id="picker">
    <header class="picker-bar">
      <button type="button" class="picker-icon" id="picker-search-btn" aria-label="搜索" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M16 16.2 19.5 19.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <p class="picker-mark dh-wordmark dh-wordmark--bar" id="picker-mark" data-brand data-brand-bar data-brand-label="选爱豆" aria-label="选爱豆"></p>
      <button type="button" class="picker-icon" id="picker-menu-btn" aria-label="菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </header>
    <form class="picker-search" id="picker-search" hidden>
      <input id="picker-query" type="search" placeholder="名字、拼音或团体" aria-label="搜索爱豆" autocomplete="off" />
    </form>
    <div class="picker-menu" id="picker-menu" hidden>
      <button type="button" id="picker-back">返回</button>
    </div>
    <div class="picker-tabs" id="picker-groups" role="tablist" aria-label="团体"></div>
    <div class="picker-stage">
      <div class="picker-pager" id="picker-pager" tabindex="0"></div>
      <div class="picker-foot">
        <div class="picker-pages" id="picker-pages" aria-label="照片位置"></div>
        <div class="picker-meta" id="picker-meta"></div>
      </div>
      <button type="button" class="picker-go" id="picker-go">开始聊天</button>
      <p class="picker-empty" id="picker-empty" hidden>没有匹配的爱豆</p>
    </div>
  </div>
  <script src="/sw-heal.js"></script>
  <script src="/account-cache.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="/brand/brand.js"></script>
  <script src="/shell/picker-groups.js"></script>
  <script src="/shell/carousel-dots.js"></script>
  <script src="/shell/portrait-loader.js"></script>
  <script src="/mobile-lock.js"></script>
  <script src="/shell/picker.js"></script>
</body>
</html>
