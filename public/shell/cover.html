<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Him" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Daily Him</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell/shell.css" />
  <link rel="stylesheet" href="/brand/brand.css" />
  <link rel="stylesheet" href="/pwa.css" />
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
</head>
<body>
  <div class="shell">
    <div class="shell-main" id="main">
      <div class="mark" id="mark"></div>
      <h1 class="dh-wordmark" id="title" data-brand></h1>
      <p class="lead" id="subtitle"></p>
      <button type="button" class="btn" id="cta">开始</button>
    </div>
    <p class="disclaimer" id="disclaimer"></p>
  </div>
  <script src="/account-cache.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="/brand/brand.js"></script>
  <script src="/pwa.js"></script>
  <script>
    (async () => {
      const copy = await Shell.loadCopy();
      document.getElementById('subtitle').textContent = copy.cover.subtitle;
      document.getElementById('disclaimer').textContent = copy.disclaimer;
      const mark = document.getElementById('mark');
      mark.innerHTML = '<img src="/icons/icon-192.png" alt="" />';

      let loggedIn = false;
      let onboarded = false;
      const me = await Shell.api('/api/me', { allow401: true });
      loggedIn = Boolean(me);
      if (loggedIn) {
        try {
          const c = Shell.selectedCharacter();
          const chars = await Shell.api('/api/characters');
          const selected = (chars.characters || []).find(ch => ch.id === c);
          if (selected) document.getElementById('disclaimer').textContent = selected.disclaimer;
          const p = await Shell.api('/api/profile?characterId=' + encodeURIComponent(c));
          onboarded = Boolean(p && p.profile && p.profile.onboardedAt);
        } catch (_) { onboarded = false; }
      }

      const cta = document.getElementById('cta');
      cta.textContent = onboarded ? copy.cover.ctaContinue : copy.cover.cta;
      cta.addEventListener('click', () => {
        const c = Shell.selectedCharacter();
        if (!loggedIn) Shell.go('/login', { next: 'pick' });
        else if (onboarded) Shell.go('/', { c });
        else Shell.go('/shell/pick.html', { c });
      });
    })();
  </script>
</body>
</html>
