<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Him" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Daily Him</title>
  <link rel="stylesheet" href="/shell/shell.css" />
  <link rel="stylesheet" href="/mobile-lock.css" />
  <link rel="stylesheet" href="/brand/brand.css" />
  <link rel="stylesheet" href="/pwa.css" />
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
</head>
<body>
  <div class="shell">
    <div class="shell-main" id="main">
      <div class="mark" id="mark"></div>
      <h1 class="dh-wordmark" id="title" data-brand></h1>
      <p class="lead" id="subtitle"></p>
      <button type="button" class="btn" id="cta">开始</button>
      <a class="link pwa-install-entry" href="/shell/install.html" data-pwa-install>添加到桌面</a>
    </div>
    <p class="disclaimer" id="disclaimer"></p>
  </div>
  <script src="/sw-heal.js"></script>
  <script src="/account-cache.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="/mobile-lock.js"></script>
  <script src="/brand/brand.js"></script>
  <script src="/pwa.js"></script>
  <script>
    (async () => {
      const copy = await Shell.loadCopy();
      document.getElementById('subtitle').textContent = copy.cover.subtitle;
      document.getElementById('disclaimer').textContent = copy.disclaimer;
      const mark = document.getElementById('mark');
      mark.innerHTML = '<img src="/icons/icon-192.png" alt="" />';

      const me = await Shell.api('/api/me', { allow401: true });
      const loggedIn = Boolean(me);
      let hasFriends = Boolean(me && me.hasFriends);
      let friendIds = [];

      if (loggedIn) {
        try {
          const friends = await Shell.api('/api/friends');
          friendIds = (friends.friends || []).map((item) => item.id);
          hasFriends = friendIds.length > 0;
          if (hasFriends) {
            const preferred = Shell.selectedCharacter();
            const c = friendIds.includes(preferred) ? preferred : friendIds[0];
            Shell.setSelectedCharacter(c);
            // Returning users (incl. PWA cold start) go straight to the chat list.
            Shell.go('/', { c });
            return;
          }
        } catch (_) {
          hasFriends = Boolean(me && me.hasFriends);
        }
      }

      const cta = document.getElementById('cta');
      cta.textContent = hasFriends ? copy.cover.ctaContinue : copy.cover.cta;
      cta.addEventListener('click', () => {
        const c = Shell.selectedCharacter();
        if (!loggedIn) Shell.go('/login', { next: 'chat' });
        else if (hasFriends) Shell.go('/', { c });
        else Shell.go('/shell/pick.html', { c });
      });
    })();
  </script>
</body>
</html>
