<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FEE500" />
  <title>充值</title>
  <link rel="stylesheet" href="/shell/shell.css" />
  <link rel="stylesheet" href="/mobile-lock.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <button type="button" id="back" aria-label="返回">‹</button>
      <h1 id="title">充值</h1>
    </div>
    <div class="balance">
      <div class="n" id="bal">0</div>
      <div class="l" id="balLabel">当前余额</div>
    </div>
    <div class="pkg-list" id="pkgs"></div>
    <button type="button" class="btn btn-ghost" id="toChat"></button>
    <p class="disclaimer" id="disclaimer"></p>
  </div>
  <script src="/sw-heal.js"></script>
  <script src="/account-cache.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="/mobile-lock.js"></script>
  <script>
    (async () => {
      const copy = await Shell.loadCopy();
      const c = Shell.qs('c') || Shell.selectedCharacter();
      const from = Shell.qs('from');
      document.getElementById('title').textContent = copy.recharge.title;
      document.getElementById('balLabel').textContent = copy.recharge.balanceLabel + '（' + copy.recharge.unit + '）';
      document.getElementById('toChat').textContent = copy.recharge.backChat;
      document.getElementById('disclaimer').textContent = copy.disclaimer;
      document.getElementById('back').onclick = () => {
        if (from === 'onboard') Shell.go('/shell/onboard.html', { c });
        else if (from === 'chat') Shell.go('/', { c });
        else history.length > 1 ? history.back() : Shell.go('/shell/cover.html');
      };
      document.getElementById('toChat').onclick = () => Shell.go('/', { c });

      async function refresh() {
        const w = await Shell.api('/api/wallet');
        document.getElementById('bal').textContent = String(w.balance ?? 0);
      }
      await refresh();

      const box = document.getElementById('pkgs');
      for (const p of copy.recharge.packages || []) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pkg';
        btn.innerHTML = `${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
          <span><div class="name">${p.name}</div><div class="coins">${p.coins} ${copy.recharge.unit}</div></span>
          <span class="price">${p.priceLabel}</span>`;
        btn.addEventListener('click', async () => {
          try {
            const r = await Shell.api('/api/wallet/purchase', {
              method: 'POST',
              body: JSON.stringify({ packageId: p.id }),
            });
            Shell.toast(r.message || copy.recharge.demoNotice);
            await refresh();
          } catch (_) { Shell.toast(copy.recharge.demoNotice); }
        });
        box.appendChild(btn);
      }
    })();
  </script>
</body>
</html>
