<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="백현" />
  <title>백현</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐶%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="phone" id="app">
    <section class="screen screen-list" id="screen-list">
      <header class="list-header">
        <h1>채팅</h1>
      </header>
      <div class="list-body">
        <button class="chat-row" id="open-chat" type="button">
          <span class="avatar" data-avatar aria-hidden="true"></span>
          <span class="row-main">
            <span class="row-top">
              <span class="row-name">백현</span>
              <time class="row-time" id="list-time"></time>
            </span>
            <span class="row-bot">
              <span class="row-preview" id="list-preview">대화를 시작해 보세요</span>
              <span class="badge" id="list-badge" hidden>1</span>
            </span>
          </span>
        </button>
      </div>
    </section>

    <section class="screen screen-room" id="screen-room" aria-hidden="true" inert>
      <div class="room-top">
        <header class="room-header">
          <button type="button" class="icon-btn" id="back-btn" aria-label="뒤로">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" class="room-title" id="profile-btn" aria-haspopup="dialog" aria-controls="profile-sheet">
            <span class="avatar sm" data-avatar aria-hidden="true"></span>
            <span class="title-text">
              <span class="name">백현 🐶 <span class="spark" id="spark" hidden></span></span>
              <span class="sub" id="room-sub">지금 대화할 수 있어요</span>
            </span>
          </button>
          <button type="button" class="icon-btn" id="menu-btn" aria-label="메뉴" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <circle cx="6" cy="12" r="1.7" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
              <circle cx="18" cy="12" r="1.7" fill="currentColor"/>
            </svg>
          </button>
        </header>
        <div class="rel-pop" id="rel-pop" hidden></div>
      </div>

      <div class="menu" id="menu" hidden>
        <button type="button" class="menu-row" id="voice-toggle" role="switch" aria-checked="true">
          <span>음성 메시지 켜기/끄기</span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <button type="button" class="menu-row" id="autoplay-toggle" role="switch" aria-checked="false" hidden>
          <span>음성 자동 재생</span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <button type="button" class="menu-row" id="moments-open-menu"><span>朋友圈 ✨</span></button>
        <button type="button" class="menu-row" id="recharge-open"><span>充值（演示）</span></button>
        <button type="button" class="menu-row" id="memory-open-menu"><span>他记得的事 💭</span></button>
        <button type="button" class="danger" id="clear-btn">대화 기록 삭제</button>
        <button type="button" class="danger" id="logout-btn">로그아웃</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="scene-bar" id="scene-bar" hidden aria-label="快捷场景"></div>
      <form class="composer" id="composer">
        <button type="button" class="icon-btn plus" id="plus-btn" aria-label="더보기">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="input" type="text" placeholder="메시지 입력" maxlength="2000" autocomplete="off" enterkeyhint="send" aria-label="메시지" />
        <button type="button" class="send-btn" id="send-btn" aria-label="보내기" aria-disabled="true">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </section>

    <div class="sheet-back" id="profile-sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="profile-title">
        <div class="grab" aria-hidden="true"></div>
        <div class="profile-hero">
          <span class="avatar lg" data-avatar aria-hidden="true"></span>
          <p class="sheet-title" id="profile-title">백현 🐶</p>
          <p class="profile-status">심심하면 말 걸어줘 🐶</p>
        </div>
        <button type="button" class="sheet-close mem-entry" id="moments-open-profile">朋友圈 ✨</button>
        <button type="button" class="sheet-close mem-entry" id="memory-open-profile">他记得的事 💭</button>
        
        <button type="button" class="sheet-close" id="profile-close">닫기</button>
      </div>
    </div>

    <div class="sheet-back" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-labelledby="sheet-title">
        <div class="grab" aria-hidden="true"></div>
        <p class="sheet-title" id="sheet-title">더보기</p>
        <p class="sheet-note">개인용 데모라서 텍스트만 보낼 수 있어요. 한국어와 중국어 모두 입력할 수 있어요.</p>
        <button type="button" class="sheet-close" id="sheet-close">닫기</button>
      </div>
    </div>

    <div class="modal-back" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">대화 기록 삭제</h2>
        <p>이 계정의 대화 기록이 서버와 이 기기에서 모두 지워져요.</p>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="modal-cancel">취소</button>
          <button type="button" class="btn-danger" id="modal-confirm">삭제</button>
        </div>
      </div>
    </div>

    <section class="mom-panel" id="mom-panel" hidden aria-labelledby="mom-title">
      <header class="mom-head">
        <button type="button" class="mom-back" id="mom-back" aria-label="返回">‹</button>
        <h2 id="mom-title">朋友圈</h2>
        <span class="mom-head-pad"></span>
      </header>
      <div class="mom-hero">
        <span class="avatar lg" data-avatar aria-hidden="true"></span>
        <p class="mom-hero-name">백현 🐶</p>
        <p class="mom-hero-sub">几天更新一次 · 图文</p>
      </div>
      <div class="mom-feed" id="mom-feed"></div>
      <p class="mom-empty" id="mom-empty" hidden>还没有动态</p>
    </section>

    <section class="mem-panel" id="mem-panel" hidden aria-labelledby="mem-title">
      <header class="mem-head">
        <button type="button" class="mem-back" id="mem-back" aria-label="返回">‹</button>
        <h2 id="mem-title">他记得的事</h2>
        <span class="mem-head-pad"></span>
      </header>
      <div class="mem-body">
        <p class="mem-tip">这些是他从聊天里记住的、关于你的事。删掉的不会再被记回来。</p>
        <div class="mem-summary" id="mem-summary" hidden>
          <p class="mem-label">之前聊过的（摘要）</p>
          <p class="mem-summary-text" id="mem-summary-text"></p>
        </div>
        <ul class="mem-list" id="mem-list"></ul>
        <p class="mem-empty" id="mem-empty" hidden>还没有记住什么，多聊聊吧 🐶</p>
        <button type="button" class="mem-clear" id="mem-clear" hidden>清空全部记忆</button>
      </div>
    </section>


    <section class="screen screen-me" id="screen-me" hidden aria-labelledby="me-title">
      <header class="list-header">
        <h1 id="me-title">我的</h1>
      </header>
      <div class="me-body">
        <div class="me-card">
          <span class="avatar lg" data-avatar aria-hidden="true"></span>
          <div class="me-info">
            <p class="me-name" id="me-display">—</p>
            <p class="me-sub" id="me-username"></p>
          </div>
        </div>
        <div class="me-rows">
          <div class="me-row"><span>他怎么叫你</span><b id="me-call">—</b></div>
          <div class="me-row"><span>你怎么叫他</span><b id="me-charnick">—</b></div>
          <div class="me-row"><span>余额（演示）</span><b id="me-balance">0</b></div>
        </div>
        <button type="button" class="me-btn" id="me-recharge">充值（演示）</button>
        <button type="button" class="me-btn" id="me-memory">他记得的事</button>
        <button type="button" class="me-btn ghost" id="me-reset">重新走一遍引导</button>
        <button type="button" class="me-btn danger" id="me-logout">退出登录</button>
      </div>
    </section>

    <nav class="tab-bar" id="tab-bar" aria-label="主导航">
      <button type="button" class="tab-item active" data-tab="chat" id="tab-chat">
        <span class="tab-ico" aria-hidden="true">💬</span>
        <span>聊天</span>
      </button>
      <button type="button" class="tab-item" data-tab="moments" id="tab-moments">
        <span class="tab-ico" aria-hidden="true">✨</span>
        <span>朋友圈</span>
      </button>
      <button type="button" class="tab-item" data-tab="me" id="tab-me">
        <span class="tab-ico" aria-hidden="true">🙂</span>
        <span>我的</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <template id="puppy-svg">
    <svg class="puppy" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="18" cy="20" rx="9" ry="13" fill="#E8A878"/>
      <ellipse cx="46" cy="20" rx="9" ry="13" fill="#E8A878"/>
      <ellipse cx="18" cy="20" rx="5" ry="8" fill="#F6D8C0"/>
      <ellipse cx="46" cy="20" rx="5" ry="8" fill="#F6D8C0"/>
      <circle cx="32" cy="36" r="18" fill="#F4C9A4"/>
      <ellipse cx="25" cy="34.5" rx="2.3" ry="3" fill="#3C2C24"/>
      <ellipse cx="39" cy="34.5" rx="2.3" ry="3" fill="#3C2C24"/>
      <ellipse cx="32" cy="41" rx="3.6" ry="2.5" fill="#E07B6C"/>
      <path d="M32 42.2v2.2" fill="none" stroke="#C85A52" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M26.8 46.2c1.6 1.8 3.3 2.6 5.2 2.6s3.6-.8 5.2-2.6" fill="none" stroke="#3C2C24" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="21.5" cy="40" r="2.3" fill="#F3A8A8" opacity=".9"/>
      <circle cx="42.5" cy="40" r="2.3" fill="#F3A8A8" opacity=".9"/>
    </svg>
  </template>
  <script src="/app.js"></script>
  <script src="/memory.js"></script>
  <script src="/moments.js"></script>
</body>
</html>
